# AprilTag pipeline configuration for race_auv_camera_pkg.
#
# launch/include/apriltag_detection.launch.py reads each `cameras:`
# entry below to start one apriltag_detector_node per enabled camera.
# The camera drivers themselves are started separately by
# launch/include/multi_camera.launch.py (hardcoded product
# names/topics for the two Stellar cameras). See
# launch/bringup_camera_perception.launch.py for the combined bringup.
#
# No fuser, no TF: the detector only publishes annotated images and
# Detection3DArray topics.
#
# To add or remove a camera, edit the `cameras:` list.

apriltag:

  # URDF that describes the tag layout in the object's base frame.
  object:
    urdf_package:   "race_station_description"
    urdf_filename:  "urdf/base.urdf"
    base_link_name: ""              # empty -> URDF root link (base_link)
    tag_link_prefix: "apriltag"
    # URDF link whose pose (in the object's base frame) is composed onto
    # the solved T_ref_to_base. The fuser publishes the TF
    # <reference_frame> -> <output_frame>, where <output_frame> is the
    # dock frame the rest of the stack uses.
    dock_link_name: "dock_point"

  # Shared detector tuning + hardware-acceleration knobs applied to
  # every apriltag_detector_node. Override per-camera in the `cameras:`
  # list if a single camera needs different behavior.
  #
  # Defaults are tuned for Jetson Orin (4 perf cores). nthreads / quad_*
  # only apply to the python (apriltag3) backend; the CUDA detector uses
  # cuda_* below.
  detector_defaults:
    nthreads:          2
    quad_decimate:     2.0
    quad_sigma:        0.0
    refine_edges:      true
    publish_rate:      5.0
    # Minimum pixel distance from a detected tag's edge to the
    # rectified image border. Detections closer than this are dropped
    # (their corners are likely clipped by the frame, giving an
    # unreliable pose). Override per-camera in the `cameras:` list.
    min_edge_dist:     10

    # --- Tag detection backend -------------------------------------------
    # Which detector apriltag_detector_node runs:
    #   "cuda"   -- in-process cuAprilTags (race_auv_apriltag_cuda);
    #               tag36h11 only. Requires the isaac_ros_nitros
    #               submodule (race_auv_perception/scripts/
    #               setup_third_party.sh). Falls back to "python"
    #               automatically when the native shim is unavailable.
    #   "python" -- apriltag3 CPU fallback (all tag families).
    detector_backend: "python"

    # cuAprilTags knobs (ignored by the python backend).
    cuda_tile_size:    4
    cuda_nominal_size: 0.125   # detector creation size; per-tag rescale
    cuda_max_tags:     64

    # --- Image stages (decode / rectify / encode) ------------------------
    #   "cuda" -- nvjpeg decode + VPI CUDA fisheye rectify + nvjpeg encode.
    #             Requires detector_backend="cuda" and compressed transport.
    #             The detection-resolution frame stays on the GPU.
    #   "cpu"  -- cv_bridge/cv2 decode + CPU rectify + cv2.imencode.
    image_pipeline: "cpu"
    # VPI warp grid spacing for the GPU rectifier (power of two).
    gpu_rectify_interval: 4

  # Master tag list. Each camera entry can override this with its own
  # `tags:` list (recommended), or omit `tags:` to fall back to this
  # list. IDs are per-family; apriltag3 uses the canonical lowercase
  # name (e.g. "tag36h11").
  #
  # The cuAprilTags backend (detector_backend: "cuda") only decodes
  # tag36h11, so the historical tag25h9 @ 21cm entries were dropped.
  # If a camera is switched back to "python", re-add its tag25h9 tags
  # here (or in its per-camera `tags:` list).
  tags:
    # 1 x tag36h11 @ 22cm
    - { id: 054, family: "tag36h11", size: 0.22 }
    # 3 x tag36h11 @ 12cm
    - { id: 146, family: "tag36h11", size: 0.12 }
    - { id: 176, family: "tag36h11", size: 0.12 }
    - { id: 185, family: "tag36h11", size: 0.12 }
    # 2 x tag36h11 @ 4cm
    - { id: 541, family: "tag36h11", size: 0.04 }
    - { id: 558, family: "tag36h11", size: 0.04 }


  # One entry per physical camera. Add / remove / enable cameras here.
  cameras:
    - name: "cam_front"
      namespace: "cam_front"
      enabled: true

      # --- apriltag_detector_node block ---
      # image_topic matches stellar_camera_node_2 in multi_camera.launch.py
      # (product_name usb-3610000.usb-2.3, remapped to stellar2/...).
      detector_namespace: "cam_front"
      image_transport: "compressed"
      image_topic: "/race/stellar2/image/compressed"
      camera_frame: "race_auv/cam_front"
      output_image_topic:     "apriltag_detection/image"
      output_detections_topic: "apriltag_detection/detections3d"
      publish_rate: 5.0
      # Optional per-camera tag override; cam_front uses the global
      # `tags:` list (all tag36h11 entries).
      # tags:
      #   - { id: 9,  family: "tag36h11", size: 0.125 }
      #   - { id: 22, family: "tag36h11", size: 0.125 }
      # stellar air intrinsics fallback (used only when info_topic is empty).
      intrinsics:
        fx: 953.919689
        fy: 954.022011
        cx: 818.210277
        cy: 665.849871
        width: 1600
        height: 1200
        distortion: [-0.064599, -0.002388, 0.001767, 0.000415]
        fisheye: true

      # --- Image-pipeline tunings (per-camera) ---
      # CUDA detection is cheap, so run at full resolution to keep small
      # and distant tags. Lower this if the CPU rectify stage becomes the
      # bottleneck (requires a node restart: the detector is created for
      # a fixed image size).
      process_scale: 1.0
      jpeg_quality: 90          # Foxglove / topside bandwidth vs. detail

    - name: "cam_down"
      namespace: "cam_down"
      enabled: true

      # image_topic matches stellar_camera_node_1 in multi_camera.launch.py
      # (product_name usb-3610000.usb-2.1, remapped to stellar1/...).
      detector_namespace: "cam_down"
      image_transport: "compressed"
      image_topic: "/race/stellar1/image/compressed"
      camera_frame: "race_auv/cam_down"
      output_image_topic:     "apriltag_detection/image"
      output_detections_topic: "apriltag_detection/detections3d"
      publish_rate: 5.0
      # cam_down sees the two 12.5cm station tags.
      tags:
        # 2 x tag36h11 @ 12.5cm
        - { id: 176, family: "tag36h11", size: 0.12 }
        - { id: 185, family: "tag36h11", size: 0.12 }
      intrinsics:
        fx: 953.919689
        fy: 954.022011
        cx: 818.210277
        cy: 665.849871
        width: 1600
        height: 1200
        distortion: [-0.064599, -0.002388, 0.001767, 0.000415]
        fisheye: true

      process_scale: 1.0
      jpeg_quality: 90

  # Multi-camera fuser. Owns the single fused dock-point TF and a matching
  # PoseStamped topic. The published frame is the URDF link named by
  # object.dock_link_name (here "dock_point"); T_ref_to_dock is computed
  # by composing the solved T_ref_to_base with the URDF's T_base_to_dock.
  fuser:
    enabled: true
    reference_frame: "race_auv/base_link"
    # Published TF: race_auv/base_link -> race_station/dock_point.
    # The leading "race_station/" prefix distinguishes the station's dock
    # frame from the AUV's own (race_auv/dock_point-style) frames; the
    # underlying URDF link name (object.dock_link_name) stays as "dock_point".
    output_frame:    "race_station/dock_point"
    output_pose_topic: "race_station/dock_point/pose"   # "" to disable
    publish_rate:    7.0
    min_pairs:       1
    detection_max_age: 0.5
    tf_timeout:      0.1