/race_auv/reporter_c2_udp_comm:
  ros__parameters:
    type: client
    server_ip: 192.168.2.12
    server_port: 5000
    client_ip: 192.168.2.60
    client_port: 6000


/race_auv/mvp_c2_reporter:
  ros__parameters:
    dccl_tx_interval: 1.0
    dccl_rx_interval: 0.2
    helm_state_list: ['start', 'kill', 'teleop', 'survey', 'mapping'] #this has to match the helm
    launch_packages: ['race_auv_bringup', 'race_auv_bringup', 'race_auv_bringup', 'race_auv_bringup',  'race_auv_bringup']
    launch_files: ['bringup_utilities', 'bringup_sensors', bringup_localization, 'bringup_mvp', 'bringup_thrusters']
    gpio_devices: ['jetson', 'dvl', 'payload_24v', 'optical_modem']  # this needs to match the gpio manager yaml

## topside stuff
/race_topside/mvp_c2_commander:
  ros__parameters:
    dccl_tx_interval: 0.5
    dccl_rx_interval: 0.5
    helm_state_list: ['start', 'kill', 'teleop', 'survey', 'mapping'] #this has to match the helm
    launch_packages: ['race_auv_bringup', 'race_auv_bringup', 'race_auv_bringup', 'race_auv_bringup',  'race_auv_bringup']
    launch_files: ['bringup_utilities', 'bringup_sensors', bringup_localization, 'bringup_mvp', 'bringup_thrusters']
    gpio_devices: ['jetson', 'dvl', 'payload_24v', 'optical_modem']  # this needs to match the gpio manager yaml

/race_topside/commander_c2_udp_comm:
  ros__parameters:
    type: server
    server_ip: 192.168.2.12
    server_port: 5000
    client_ip: 192.168.2.60
    client_port: 6000

