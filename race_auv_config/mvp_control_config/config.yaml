control_modes:
  idle: false

  # teleop:
  #   u:      {p: 1.0,  i: 3.0,   d: 5.0, v: 5.0,  pid_max: 10, pid_min: -10}
  #   r:   {p: 2.0,  i: 0.5,   d: 3.0, v: 5.0,  pid_max: 20, pid_min: -20}
  #   p: {p: 2.0,  i: 0.5,   d: 3.0, v: 5.0,  pid_max: 20, pid_min: -20}

  flight:
    # roll is minimal, surge is fast, slight pitch.
    v:     {p: 5.0 ,  i: 0.2,   d: 0.0, v: 5.0,  pid_max: 15, pid_min: -15}
    pitch:    {p: 5.0,   i: 1.0,  d: 0.0, v: 5.0,  pid_max: 20, pid_min: -20}
    yaw:      {p: 4.0,   i: 0.2,   d: 0.0, v: 5.0,  pid_max: 15, pid_min: -15}
    z:        {p: 15.0,   i: 1.0 ,  d: 0.0, v: 5.0,  pid_max: 30, pid_min: -30}
    roll:     {p: 2.0,   i: 0.1,  d: 0.0, v: 5.0,  pid_max: 10, pid_min: -10}
    u:    {p: 30.0,   i: 1.5,   d: 0.0, v: 5.0,   pid_max: 50, pid_min: -50}


  teleop:
    v:        {p: 10.0 ,  i: 0.2,   d: 0.0, v: 5.0,  pid_max: 15, pid_min: -15}
    pitch:    {p: 50.0,   i: 1.0,  d: 0.0, v: 25.0,  pid_max: 50, pid_min: -50}
    yaw:      {p: 35.0,   i: 1.0,   d: 0.0, v: 25.0,  pid_max: 25, pid_min: -25}
    z:        {p: 70.0,   i: 10.0,  d: 0.0, v: 30.0,  pid_max: 50, pid_min: -50}
    roll:     {p: 2.0,   i: 0.1,  d: 0.0, v: 5.0,  pid_max: 10, pid_min: -10}
    u:        {p: 30.0,   i: 1.5,   d: 0.0, v: 5.0,   pid_max: 50, pid_min: -50}

  # Noetic Teleop
  # hold_dof:
  # sway: {p: 5.0, i: 0.2, d: 5.0, pid_max: 15, pid_min: -15}
  # pitch: {p: 5.0, i: 1.0, d: 3.0, pid_max: 20, pid_min: -20}
  # yaw: {p: 4.0, i: 0.2, d: 8.0, pid_max: 15, pid_min: -15}
  # z: {p: 15.0, i: 1.0, d: 5.0, pid_max: 30, pid_min: -30}
  # roll: {p: 2.0, i: 0.1, d: 8.0, pid_max: 5, pid_min: -5}
  # surge: {p: 30.0, i: 1.5, d: 5.0, pid_max: 50, pid_min: -50}

